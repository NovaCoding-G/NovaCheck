name: NovaCheck
description: Security and AI-provenance trust scan for pull requests
author: NovaCoding-G
branding:
  icon: shield
  color: green

inputs:
  path:
    description: Project directory to scan
    default: .
  fail-below:
    description: Fail when Trust Score is below this value
    default: "85"
  fail-on-incomplete:
    description: Fail when one or more inputs could not be analyzed
    default: "true"
  offline:
    description: Disable package registry network requests
    default: "false"
  changed:
    description: Evaluate only files changed from the base ref
    default: "true"
  base:
    description: Git ref used by changed mode
    default: ""
  upload-sarif:
    description: Upload findings to GitHub Code Scanning
    default: "true"
  version:
    description: Exact NovaCheck npm version (use "local" only for repository CI)
    default: "0.4.0"

runs:
  using: composite
  steps:
    - name: Set up Bun for local repository validation
      if: ${{ inputs.version == 'local' }}
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: 1.3.14

    - name: Install local NovaCheck dependencies
      if: ${{ inputs.version == 'local' }}
      shell: bash
      run: bun install --cwd "$GITHUB_ACTION_PATH" --frozen-lockfile

    - name: Run NovaCheck
      id: scan
      continue-on-error: true
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_FAIL_BELOW: ${{ inputs.fail-below }}
        INPUT_OFFLINE: ${{ inputs.offline }}
        INPUT_CHANGED: ${{ inputs.changed }}
        INPUT_BASE: ${{ inputs.base }}
        INPUT_FAIL_ON_INCOMPLETE: ${{ inputs.fail-on-incomplete }}
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        args=("$GITHUB_WORKSPACE/$INPUT_PATH" "--sarif" "$GITHUB_WORKSPACE/.novacheck/novacheck-results.sarif" "--no-html" "--fail-below" "$INPUT_FAIL_BELOW")
        if [[ "$INPUT_OFFLINE" == "true" ]]; then
          args+=("--offline")
        fi
        if [[ "$INPUT_CHANGED" == "true" ]]; then
          args+=("--changed")
          if [[ -n "$INPUT_BASE" ]]; then
            args+=("$INPUT_BASE")
          elif [[ -n "${GITHUB_BASE_REF:-}" ]]; then
            args+=("origin/$GITHUB_BASE_REF")
          fi
        fi
        if [[ "$INPUT_FAIL_ON_INCOMPLETE" == "true" ]]; then
          args+=("--fail-on-incomplete")
        else
          args+=("--allow-incomplete")
        fi
        if [[ "$INPUT_VERSION" == "local" ]]; then
          bun run "$GITHUB_ACTION_PATH/src/cli.ts" "${args[@]}"
        else
          npm exec --yes --package="novacheck@$INPUT_VERSION" -- novacheck "${args[@]}"
        fi

    - name: Upload SARIF
      if: >-
        ${{ inputs.upload-sarif == 'true' &&
            hashFiles('.novacheck/novacheck-results.sarif') != '' &&
            (github.event_name != 'pull_request' ||
             github.event.pull_request.head.repo.full_name == github.repository) }}
      uses: github/codeql-action/upload-sarif@24c7eb380a2dc368f2d129e4c65e51d172983a1e # v4
      with:
        sarif_file: .novacheck/novacheck-results.sarif

    - name: Enforce NovaCheck policy
      if: ${{ steps.scan.outcome == 'failure' }}
      shell: bash
      run: exit 1
