name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Verify release tag belongs to main
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          git fetch origin main
          # Resolve the tag to a commit before any repository code runs.
          # Do not place "--" before the tag: git would treat it as a pathspec.
          tag_commit="$(git rev-parse --verify "${RELEASE_TAG}^{commit}")"
          git merge-base --is-ancestor "$tag_commit" origin/main

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - name: Install npm with trusted publishing support
        run: npm install --global npm@12.0.2

      - run: bun install --frozen-lockfile

      - name: Verify release metadata
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: bun run scripts/check-release-version.ts "$RELEASE_TAG"

      - run: bun run check
      - run: npm pack --dry-run

      - name: Publish to npm with provenance
        run: npm publish --access public --provenance
