name: NovaCheck

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: ./
        with:
          version: local
          changed: ${{ github.event_name == 'pull_request' }}
          upload-sarif: true
          fail-below: "85"
          fail-on-incomplete: true
