name: NovaCheck

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./
        with:
          changed: ${{ github.event_name == 'pull_request' }}
          upload-sarif: true
          fail-below: "85"
