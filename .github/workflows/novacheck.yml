name: NovaCheck

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: ./
        with:
          version: local
          changed: ${{ github.event_name == 'pull_request' }}
          upload-sarif: true
          fail-below: "85"
          fail-on-incomplete: true
